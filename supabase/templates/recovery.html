<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fff9ee;
      font-family: Helvetica, Arial, sans-serif;
      color: #3a3a3a;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #fff9ee; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border-radius: 16px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 22px;
                    font-weight: bold;
                    color: #121212;
                  "
                >
                  pitchype
                </p>
                <h1
                  style="
                    margin: 0 0 12px;
                    font-size: 24px;
                    line-height: 1.2;
                    color: #121212;
                  "
                >
                  Reset your password
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
                  We got a request to reset the password for your Pitchype
                  account. Use the button below to choose a new one.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
                    style="
                      display: inline-block;
                      background: #121212;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: bold;
                      font-size: 16px;
                      padding: 14px 24px;
                      border-radius: 12px;
                    "
                  >
                    Choose a new password
                  </a>
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.5;
                    color: #666666;
                  "
                >
                  The link works once and expires in an hour. If you didn't ask
                  for this, ignore this email and your password stays the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
